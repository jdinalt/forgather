[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgather*"]

[tool.setuptools.package-data]
forgather = ["gpu_flops.yaml"]

[project]
name = "forgather"
description = "ML project configuration framework."
#readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "accelerate ~= 1.11",
    "datasets ~= 4.3",
    "ipython >= 8.12.3",
    "Jinja2 ~= 3.1",
    "matplotlib ~= 3.8",
    "numpy ~= 1.26",
    "platformdirs ~= 3.10",
    "PyYAML ~= 6.0",
    "tensorboard ~= 2.16",
    "tokenizers ~= 0.22",
    "torch ~= 2.10.0",
    "torchvision ~= 0.24",
    "transformers ~= 5.0",
    # Embedding model for the optional docs vector/hybrid search. Imported
    # lazily (only when building the index or running a vector search), so it
    # adds no import-time cost; torch is already a dependency, so the marginal
    # install/container weight is small.
    "sentence-transformers >= 3.0",
    "tqdm ~= 4.65",
    "aiohttp ~= 3.9",
    "torchao ~= 0.16.0",
    "torchdata ~= 0.11",
    # Used on-disk for sharded checkpoints and on-the-wire for the DiLoCo bulk
    # transport (issue #154). Promoted from a transitive import to an explicit
    # dependency now that the wire path depends on it.
    "safetensors ~= 0.7",
    # DiLoCo gRPC bulk transport (issue #154). grpcio is the runtime; grpcio-tools
    # regenerates the committed proto stubs (proto/generate.sh). Both in the main
    # deps per the repo's no-optional-extras policy — a ~6 MB wheel is negligible
    # next to PyTorch/CUDA.
    "grpcio ~= 1.80",
    "grpcio-tools ~= 1.80",
    # Pinned because tools/forgather_server/asgi_tls_protocol.py subclasses
    # uvicorn.protocols.http.{h11,httptools}_impl (private paths) to surface
    # the peer's TLS client cert on the ASGI scope. A uvicorn bump that
    # changes those protocol classes can break inter-node mTLS auth at
    # runtime — pinning lets `pip install` fail loudly instead.
    "uvicorn >= 0.46, < 0.47",
    "websockets",
    "fastapi",
    "httpx",
    "zeroconf",
    "psutil",
    "nvidia-ml-py",
    "openai",
    "anthropic",
    "huggingface_hub",
    "cryptography",
    "pytest >= 7.0.0",
    "pytest-cov >= 4.0.0",
    "pytest-mock >= 3.10.0",
    "black",
    "isort",
    "cut-cross-entropy >= 25.1",
    "liger-kernel",
    "triton",
    "dacite",
    # Documentation toolchain. Bundled into the base install (rather
    # than gated behind a [docs] extra) because the dep-tree footprint
    # is rounding-error compared to PyTorch, and shipping them by
    # default makes the Forgather server's 📖 MkDocs… tool work
    # out-of-the-box without RTFM steps.
    "mkdocs >= 1.6",
    "mkdocs-material >= 9.5",
    "mkdocstrings[python] >= 0.25",
    "mkdocs-jupyter >= 0.24",
]
version = "1.2.0"
authors = [
    {name = "Jason dinAlt", email = "joedkloss@gmail.com"},
]
keywords = [
    "ml", "config", "configuration", "trainer", "training", "machine learning",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
]

# Note: no [project.optional-dependencies] block — the [docs] /
# [test] extras have been folded into the main ``dependencies``
# above. Their footprint is negligible next to PyTorch, and
# bundling them removes a class of "I installed forgather but
# feature X doesn't work" support questions. Add an optional
# group here only when the extra cost is genuinely substantial.

[project.scripts]
forgather = "forgather.cli:main"

[tool.isort]
profile = "black"
# Generated gRPC stubs are committed as-emitted by protoc; never reorder them
# (it would diverge from a fresh regenerate). See proto/generate.sh.
# ``filter_files`` is required so the skip applies even when the pre-commit hook
# passes the files explicitly (isort ignores skip_glob for explicit args
# otherwise).
filter_files = true
extend_skip_glob = ["*_pb2.py", "*_pb2_grpc.py"]

[tool.black]
line-length = 88
# Skip the generated gRPC stubs even when passed explicitly (e.g. by the
# pre-commit hook), so the committed files match a fresh protoc regenerate.
force-exclude = '.*_pb2(_grpc)?\.py$'
