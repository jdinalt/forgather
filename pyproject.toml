[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgather*"]

[tool.setuptools.package-data]
forgather = ["gpu_flops.yaml"]

[project]
name = "forgather"
description = "ML project configuration framework."
#readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.12"

dependencies = [
    "accelerate ~= 1.11",
    "datasets ~= 4.3",
    "ipython >= 8.12.3",
    "Jinja2 ~= 3.1",
    "matplotlib ~= 3.8",
    "numpy ~= 1.26",
    "platformdirs ~= 3.10",
    "PyYAML ~= 6.0",
    "tensorboard ~= 2.16",
    "tokenizers ~= 0.22",
    "torch ~= 2.10.0",
    "torchvision ~= 0.24",
    "transformers ~= 5.0",
    "tqdm ~= 4.65",
    "aiohttp ~= 3.9",
    "torchao ~= 0.16.0",
    "torchdata ~= 0.11",
    "uvicorn",
    "websockets",
    "fastapi",
    "httpx",
    "psutil",
    "pynvml",
    "openai",
    "huggingface_hub[cli]",
    "pytest >= 7.0.0",
    "pytest-cov >= 4.0.0",
    "pytest-mock >= 3.10.0",
    "black",
    "isort",
    "cut-cross-entropy >= 25.1",
    "liger-kernel",
    "triton",
    "dacite",
    # Documentation toolchain. Bundled into the base install (rather
    # than gated behind a [docs] extra) because the dep-tree footprint
    # is rounding-error compared to PyTorch, and shipping them by
    # default makes the Forgather server's 📖 MkDocs… tool work
    # out-of-the-box without RTFM steps.
    "mkdocs >= 1.6",
    "mkdocs-material >= 9.5",
    "mkdocstrings[python] >= 0.25",
    "mkdocs-jupyter >= 0.24",
]
version = "1.0.1"
authors = [
    {name = "Jason dinAlt", email = "joedkloss@gmail.com"},
]
keywords = [
    "ml", "config", "configuration", "trainer", "training", "machine learning",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]

# Note: no [project.optional-dependencies] block — the [docs] /
# [test] extras have been folded into the main ``dependencies``
# above. Their footprint is negligible next to PyTorch, and
# bundling them removes a class of "I installed forgather but
# feature X doesn't work" support questions. Add an optional
# group here only when the extra cost is genuinely substantial.

[project.scripts]
forgather = "forgather.cli:main"

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
