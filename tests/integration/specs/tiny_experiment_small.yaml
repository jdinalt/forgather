test_id: tiny_experiment_small
project_dir: examples/tiny_experiments/tiny_experiment
config: v2.yaml
dynamic_args:
  max_steps: 3600
loss:
  final_max: 3.5
  no_nan: true
stderr:
  forbidden_patterns:
    - "RuntimeError"
    - "CUDA error"
    - "Traceback"
  warn_patterns: []
expected_files:
  - trainer_logs.json
min_steps_logged: 1
timeout: 300
gpu_requirement: 1
markers:
  - integration
  - slow