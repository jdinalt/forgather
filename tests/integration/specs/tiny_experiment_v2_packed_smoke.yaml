test_id: tiny_experiment_v2_packed_smoke
project_dir: examples/tiny_experiments/tiny_experiment
config: v2_packed.yaml
dynamic_args:
  max_steps: 150
loss:
  final_max: 4.0
  no_nan: true
stderr:
  forbidden_patterns:
    - "RuntimeError"
    - "CUDA error"
    - "Traceback"
  warn_patterns: []
expected_files:
  - trainer_logs.json
min_steps_logged: 1
timeout: 300
gpu_requirement: 1
markers:
  - integration
  - smoke
