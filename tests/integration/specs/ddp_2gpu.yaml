test_id: ddp_2gpu
project_dir: examples/tiny_experiments/ddp_trainer
config: 2gpu.yaml
dynamic_args:
  max_steps: 1000
loss:
  final_max: 2.0
  no_nan: true
stderr:
  forbidden_patterns:
    - "RuntimeError"
    - "CUDA error"
    - "Traceback"
  warn_patterns: []
expected_files:
  - trainer_logs.json
min_steps_logged: 1
timeout: 300
gpu_requirement: 2
markers:
  - integration
  - smoke