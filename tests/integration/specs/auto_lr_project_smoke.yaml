test_id: auto_lr_project_smoke
project_dir: examples/base_lm_project
config: auto_lr_project.yaml
dynamic_args:
  max_steps: 260
loss:
  final_max: 6.2
  no_nan: true
stderr:
  forbidden_patterns:
    - "RuntimeError"
    - "CUDA error"
    - "Traceback"
  warn_patterns: []
expected_files:
  - trainer_logs.json
min_steps_logged: 1
timeout: 300
gpu_requirement: 2
markers:
  - integration
  - smoke