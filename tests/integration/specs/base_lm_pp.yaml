test_id: base_lm_pp
project_dir: examples/base_lm_project
config: pp.yaml
dynamic_args:
  max_steps: 150
  save_strategy: "no"
loss:
  final_max: 8.5
  no_nan: true
stderr:
  forbidden_patterns:
    - "RuntimeError"
    - "CUDA error"
    - "Traceback"
  warn_patterns: []
expected_files:
  - trainer_logs.json
min_steps_logged: 1
timeout: 600
gpu_requirement: 2
markers:
  - integration
  - smoke
