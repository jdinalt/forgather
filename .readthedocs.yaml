# ReadTheDocs build configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # The mkdocs toolchain ships in the base ``dependencies`` block
    # of pyproject.toml, so no extra_requirements are needed. The
    # project install is what mkdocstrings needs to import the
    # forgather package and extract docstrings.
    - method: pip
      path: .
