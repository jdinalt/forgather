# ReadTheDocs build configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    # Install only the docs toolchain — forgather itself is *not*
    # installed. mkdocstrings parses ``src/forgather`` statically via
    # griffe (see mkdocs.yml's ``paths: [src]`` + ``allow_inspection:
    # false``), so the runtime deps (torch, CUDA wheels, transformers,
    # ...) aren't needed to render docstrings. This drops the build's
    # install footprint from ~3 GB to ~250 MB.
    - requirements: docs/requirements.txt
