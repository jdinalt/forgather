-- extends "configs/default.yaml"

[config_metadata]
    == super()
    -- set ns.config_name = "Gemma-3 Small"
    -- set ns.config_description = "A Gemma-3 with ~30M parameters"
    -- set ns.model_name = "gemma3_small"

[model_definition]
    -- include "config.small.model"

#------------- config.small.model --------------
-- extends "config.default.model"

## Swap Gemma's native (262K-vocab) tokenizer for the shared wikitext 8K
## tokenizer, so this small model is directly comparable to the other
## small models in the collection.
[model_tokenizer]
tokenizer: &tokenizer !call:forgather:from_project
    project_dir: "{{ joinpath(ns.forgather_dir, 'examples', 'tokenizers', 'wikitext') }}"
    config_template: "8k.yaml"

[model_config]
    == super()
    # **Gemma-3 Small Overrides**
    hidden_size: {{ hidden_size | toyaml(512) }}
    intermediate_size: {{ intermediate_size | toyaml(1280) }}
    num_attention_heads: {{ num_attention_heads | toyaml(8) }}
    num_key_value_heads: {{ num_key_value_heads | toyaml(2) }}
    num_hidden_layers: {{ num_hidden_layers | toyaml(10) }}
    head_dim: {{ head_dim | toyaml(64) }}
    query_pre_attn_scalar: {{ query_pre_attn_scalar | toyaml(64) }}
    sliding_window: {{ sliding_window | toyaml(512) }}
    ## Regenerate layer_types for this layer count -- super() emitted a list
    ## sized for the default (18) layers; the later YAML key wins.
    -- set _g = namespace(lt=[])
    -- for _i in range(num_hidden_layers | default(10) | int)
    -- set _ = _g.lt.append("full_attention" if ((_i + 1) % (sliding_window_pattern | default(6) | int) == 0) else "sliding_attention")
    -- endfor
    layer_types: {{ _g.lt | toyaml }}
