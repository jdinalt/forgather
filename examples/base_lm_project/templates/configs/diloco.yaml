-- extends "projects/lm_training_project.yaml"

## DiLoCo bringup target — composed from mixins.
##
## Mixin imports below pull in per-section macros that emit YAML
## fragments. Namespace mutation (`-- set ns.X = …`) stays inline in
## the leaf so the override chain is visible at the call site (and
## because Jinja namespaces don't survive macro-parameter passing
## anyway).
##
## Composition recipe:
##   - mixins/finetune: load-from-path scaffolding (model_id_or_path,
##     from_pretrained_config, --model-id-or-path arg + deletions).
##   - mixins/diloco: callback entry, DiLoCo dynamic args, eval-bypass
##     injection. Worker-id suffix is inline below because it mutates ns.
##
## Activation:
##   - DILOCO_SERVER env var (set by the scheduler) OR --diloco-server
##     CLI override → callback gets constructed, eval bypass active.
##   - Neither set → callback include falls through to plain
##     lm_callbacks; same leaf runs as a vanilla finetune.
##
## When DiLoCo is on, the callback fails fast at startup if the server
## isn't reachable — no silent training-island fallback.

{% from "mixins/finetune.yaml" import
    variable_listing as ft_variable_listing,
    dynamic_args as ft_dynamic_args
    with context
%}
{% from "mixins/diloco.yaml" import
    callback_entry as dl_callback_entry,
    dynamic_args as dl_dynamic_args
    with context
%}


[config_metadata]
    == super()
    -- set ns.config_name = "DiLoCo"
    -- set ns.config_description = "DiLoCo webui bringup prototype"
    -- set ns.model_name = model_name | default("diloco")

    ## Dataset override: TinyStories (fast-iter-packed) for bringup
    ## smoke runs. ~2M rows → ~2000 rows/unit at K=1024 so the
    ## work-dispatch loop cycles visibly in minutes. CLI
    ## --dataset-project / --dataset-config still override.
    -- set ns.dataset_proj = dataset_proj | default(abspath(joinpath(ns.forgather_dir, "examples", "datasets", "roneneldan")))
    -- set ns.dataset_config = dataset_config | default("fast-iter-packed.yaml")


[globals]
    == super()
    ## finetune: default model_id_or_path to per-model output dir.
    -- set ns.model_id_or_path = model_id_or_path | default(joinpath(ns.models_dir, ns.model_name))

    ## diloco: append worker-id to model_name so each worker gets a
    ## unique output dir. When DILOCO_WORKER_ID is unset (vanilla
    ## mode), ns.model_name stays intact.
    -- if getenv("DILOCO_WORKER_ID")
    -- set ns.model_name = ns.model_name + "_" + getenv("DILOCO_WORKER_ID")
    -- endif

    ## Output / logging dirs derive from the final ns.model_name
    ## (after the diloco worker-id append).
    -- set ns.output_dir = joinpath(ns.models_dir, ns.model_name)
    -- set ns.logging_dir = joinpath(ns.output_dir, "runs", ns.log_name + '_' + filetime())


[variable_listing]
    == super()
{{ ft_variable_listing(ns.model_id_or_path) }}


## (was: eval_pp_args injected diloco_work_dispatch: False. Under the
## composable-level dispatch design, eval bypass is handled by
## lm_training_project's shard_dataset: False override for the eval
## dataset when DILOCO_SERVER is set — no per-leaf injection needed.)


[construct_new_model]
    ## finetune scaffolding: load from pretrained config. Inlined
    ## here (not in the mixin) because Jinja macros can't carry ns
    ## through ``-- include`` boundaries.
    -- include 'models/causal_lm/from_pretrained_config.yaml'


[trainer_callbacks]
    ## DiLoCo enable-gate. When off → vanilla lm_callbacks. When on
    ## → delegated sub-template below that extends lm_callbacks and
    ## adds the DiLoCo callback (Forgather's diamond-resolution
    ## pattern for "this block extends a second template").
    -- if getenv("DILOCO_SERVER") or (diloco_server is defined and diloco_server)
    -- include 'diloco_callbacks_subtemplate'
    -- else
    -- include 'callbacks/lm_callbacks.yaml'
    -- endif


[dynamic_args]
    == super()
{{ ft_dynamic_args() }}
{{ dl_dynamic_args() }}


#-------------------- diloco_callbacks_subtemplate --------------------
-- extends 'callbacks/lm_callbacks.yaml'
{% from "mixins/diloco.yaml" import callback_entry as dl_callback_entry with context %}

[callback_list]
    => super()
{{ dl_callback_entry() }}
