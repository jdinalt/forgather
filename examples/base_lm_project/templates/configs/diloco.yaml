-- extends "projects/lm_training_project.yaml"

## DiLoCo bringup target — a finetune leaf with a preset dataset
## suited for visibly cycling the work-unit dispatch loop. The DiLoCo
## wiring itself (callback, CLI args, worker-id suffix) lives in
## lm_training_project.yaml and fires whenever DILOCO_SERVER is set;
## this leaf only contributes finetune scaffolding + preset
## overrides.
##
## Activation:
##   - DILOCO_SERVER env var (set by the scheduler) OR --diloco-server
##     CLI override → callback gets constructed, eval bypass active.
##   - Neither set → same leaf runs as a vanilla finetune against
##     the preset dataset.

{% from "mixins/finetune.yaml" import
    variable_listing as ft_variable_listing,
    dynamic_args as ft_dynamic_args
    with context
%}


[config_metadata]
    == super()
    -- set ns.config_name = "DiLoCo"
    -- set ns.config_description = "DiLoCo webui bringup prototype"
    -- set ns.model_name = model_name | default("diloco")

    ## Dataset override: TinyStories (fast-iter-packed) for bringup
    ## smoke runs. ~2M rows → ~2000 rows/unit at K=1024 so the
    ## work-dispatch loop cycles visibly in minutes. CLI
    ## --dataset-project / --dataset-config still override.
    -- set ns.dataset_proj = dataset_proj | default(abspath(joinpath(ns.forgather_dir, "examples", "datasets", "roneneldan")))
    -- set ns.dataset_config = dataset_config | default("fast-iter-packed.yaml")


[globals]
    == super()
    ## finetune: default model_id_or_path to per-model output dir.
    -- set ns.model_id_or_path = model_id_or_path | default(joinpath(ns.models_dir, ns.model_name))


[variable_listing]
    == super()
{{ ft_variable_listing(ns.model_id_or_path) }}


[construct_new_model]
    ## finetune scaffolding: load from pretrained config. Inlined
    ## here (not in the mixin) because Jinja macros can't carry ns
    ## through ``-- include`` boundaries.
    -- include 'models/causal_lm/from_pretrained_config.yaml'


[dynamic_args]
    == super()
{{ ft_dynamic_args() }}
