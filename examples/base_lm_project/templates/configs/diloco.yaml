-- extends "projects/lm_training_project.yaml"

## DiLoCo bringup target. ``enable_diloco = True`` forces template
## rendering as DiLoCo-enabled; the parent project owns all the
## actual wiring (callback, work-unit dispatch on train, conditional
## from_pretrained_config model construction, --diloco-* CLI args,
## worker-id-suffixed output dir). This leaf just sets the preset
## dataset for the bringup smoke run.
##
## NB: ``enable_diloco`` is a RENDER-TIME signal. Running this config
## still requires ``DILOCO_SERVER`` to be set in the worker env
## (preprocess_dataset's validity check rejects ``work_units`` without
## it). Set DILOCO_SERVER via the scheduler / launcher when actually
## training; the flag here lets ``forgather pp`` / ``ls`` show the
## DiLoCo-enabled rendering without spinning up a server.


[config_metadata]
    == super()
    -- set ns.config_name = "DiLoCo"
    -- set ns.config_description = "DiLoCo webui bringup prototype"
    -- set ns.model_name = model_name | default("diloco")

    -- set ns.enable_diloco = enable_diloco | default(True)