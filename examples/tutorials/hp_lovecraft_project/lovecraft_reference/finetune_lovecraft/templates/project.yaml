-- extends 'projects/finetune_v2.yaml'

## Lovecraft fine-tune base.  Extends the ``finetune_v2`` project template,
## which in turn extends ``lm_training_project.yaml``.  The parent wires up
## token-budget-driven step computation, automatic LR scaling from batch
## size, and WSD learning-rate scheduler
## See ``docs/project-templates/lm-training-projects.md`` for the full parameter
## list.

[config_metadata]
    == super()
    -- set ns.config_name = "Lovecraft Finetune"
    -- set ns.config_description = "Fine-tune a causal LM on H.P. Lovecraft"

    ## Dataset.  Points at the sibling dataset project in this workspace.
    -- set ns.dataset_proj = joinpath(workspace_root, 'lovecraft_dataset')
    -- set ns.dataset_config = dataset_config | default("lovecraft-packed.yaml")

    ## Batching.  Override from a child config or on the CLI via
    ## ``--seq-len`` / ``--batch-size``.  The dataset's ``block_tokenize_fn``
    ## receives ``ns.seq_len`` as ``max_length``.
    -- set ns.seq_len = seq_len | default(4096)
    -- set ns.per_device_train_batch_size = batch_size | default(1)

    ## Token budget.  The default (~7M tokens) works out to roughly 10 epochs
    ## on the ~156-block packed corpus at 4K context.
    -- set ns.total_tokens = total_tokens | default(7)

    ## Compile.  finetune_v2 defaults torch_compile=True with max-autotune,
    ## which is great for throughput on a spare GPU but expensive on memory;
    ## disable by default for the tutorial's 24 GB target budget.  Enable
    ## with ``--compile true`` from the CLI when you have headroom.
    -- set ns.torch_compile = compile | default(False)

    ## Log every 1M tokens, validate every 25M, save every 500M (these are
    ## the ``lm_training_project`` defaults -- ``ns.step_cadence``
    ## scales them all uniformly).  For a small dataset we want to log more
    ## often; tighten the cadence so evaluation tracks training progress.
    -- set ns.step_cadence = step_cadence | default(0.02)

    ## LR annealing budget (millions of tokens).  WSD scheduler from
    ## ``finetune_v2`` holds LR constant until start_annealing is
    ## triggered; ``ns.decay_start_step`` (below) auto-triggers the decay
    ## at total_steps - annealing_steps.
    -- set ns.annealing_tokens = annealing_tokens | default(10)

    ## LR calibration.  `ns.base_lr` is the learning rate that was found
    ## stable for this project at `ns.base_batch_size` tokens per step in
    ## an LR sweep; `lm_training_project` scales it with actual global
    ## batch size by `ns.lr_alpha` (sqrt scaling, 0.5, by default).
    ##
    ## Calibrated on Mistral-7B + Adafactor at batch_size=1, actual 4K
    ## tokens per step.  Set `ns.base_batch_size = 4096` so a run at a
    ## larger seq_len or batch size automatically scales LR upward.
    -- set ns.base_lr = lr | default(5.0e-5)
    -- set ns.base_batch_size = 4096

    ## Text-generation eval prompts.  finetune_v2's TextgenCallback
    ## periodically samples from the model during training to make
    ## quality regressions visible in tensorboard.  Default prompts are
    ## generic short-story openings; swap in a Lovecraft-flavoured set
    ## of invented titles and opening lines so the generated samples
    ## show whether the fine-tune is actually picking up the target
    ## style.  Path is set as an absolute path resolved from
    ## ``project_dir`` (the training project dir) so it doesn't depend
    ## on the shell's CWD at training time.
    -- set ns.eval_prompts_file = eval_prompts_file | default(abspath(joinpath(project_dir, "../../prompts/lovecraft_seeds.yaml")))
    -- set ns.eval_max_new_tokens = eval_max_new_tokens | default(256)

[globals]
    == super()
    ## Auto-decay trigger: WSD switches from stable -> decay at this step.
    ## Same pattern as examples/pretrain/small-llm and open-orca.
    -- set ns.decay_start_step = [ns.warmup_steps, (ns.total_steps - ns.annealing_steps)] | max | int

[variable_listing]
    == super()
# ns.decay_start_step: {{ ns.decay_start_step }}

[trainer_args]
    == super()
    ## Single-GPU memory knobs.  Together these fit 7B + 16K context on
    ## a 24 GB card; on larger cards they can be disabled for more speed.
    gradient_checkpointing: {{ gradient_checkpointing | default(True) }}
    fuse_optim_with_backward: {{ fuse_optim_with_backward | default(True) }}
    enable_activation_offloading: {{ activation_offloading | default(True) }}

    ## finetune_v2 defaults max_steps = -1, which runs for
    ## `num_train_epochs` worth of data.  Here we rebind max_steps to
    ## ns.total_steps so child configs' `total_tokens` parameter bounds
    ## training.
    ##
    ## Tradeoff: epochs vs token budget.  The block tokenizer carries
    ## unused tail tokens across block boundaries, so one epoch is an
    ## approximately fixed number of *tokens* regardless of seq_len or
    ## batch size -- which means epochs are seq_len-invariant too.  The
    ## practical differences:
    ##   - Epochs are easier to reason about when the goal is fitting a
    ##     fixed corpus without over-training on the same data.
    ##   - A token budget is easier to reason about when the axis of
    ##     experimentation is context length, and it lets you set
    ##     `decay_start_step` directly without first counting tokens per
    ##     epoch for a given tokenizer.
    ## Revert to epochs by setting `max_steps: -1` here and using
    ## `--epochs N` on the CLI; warmup_tokens / annealing_tokens still work
    ## (they're converted to step counts independently of max_steps).
    max_steps: {{ max_steps | toyaml(ns.total_steps) }}

[lr_scheduler]
lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:WSDScheduler@lr_scheduler
    warmup_steps: {{ ns.warmup_steps }}
    min_lr: {{ ns.min_lr | toyaml }}
    decay_steps: {{ ns.annealing_steps }}
    decay_start_step: {{ ns.decay_start_step }}
    start_decay: {{ start_annealing | toyaml(False) }}