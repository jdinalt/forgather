[config_metadata]
    == super()
    -- set ns.config_name = "OpenThoughts3 Packed"
    -- set ns.config_description = "OpenThoughts3 with best-fit sequence packing."

[map_function]
{{ packed_chat_template_map_function(
    ns.openthoughts_src ~ ":openthoughts_packed_map_fn",
    ns.openthoughts_src ~ ":load_chat_template",
    ns.chat_template,
    max_length=max_length | default(512),
    stride=stride | default(0)) }}

[map_kwargs]
    == super()
{{ packed_map_kwargs() }}

[dynamic_args]
    == super()
{{ packed_dynamic_args() }}
