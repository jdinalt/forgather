-- extends "configs/en.yaml"

[config_metadata]
    == super()
    -- set ns.config_name = "C4 Packed"
    -- set ns.config_description = "A packed version of C4"

[map_function]
.define: &map_function !partial:forgather.ml.datasets:block_tokenize_fn
    max_length: {{ max_length | default(512) }}
    overflow: True
    packed: True
    shuffle_output: True
    stride: {{ stride | default(0) }}
    packing_strategy: "best_fit"
    min_len: 32
    add_bos: True
    add_eos: True

[map_kwargs]
    == super()
    batch_size: 250

[dynamic_args]
    == super()
    max_length:
        names: "--max-length"
        type: "int"
        help: "Maximum length of output sequences."
    stride:
        names: "--stride"
        type: "int"
        help: "Number of tokens to repeat from previous overflowing example."