-- extends "datasets/dataset_type.yaml"

[config_metadata]
    == super()
    -- set ns.config_name = "Code Interleaved"
    -- set ns.config_description = "Interleave all ajibawa-2023 code datasets (Python, C++, C, JavaScript)"
    -- set ns.main_feature = "text"

[main_body]
.define: &tokenizer !var "tokenizer"

    [pp_kwargs]
.define: &pp_kwargs !dict

    [python_code]
.define: &python_code !call:forgather:from_project
    <<: &dataset_args
        preprocess_args: !var "preprocess_args"
        tokenizer: *tokenizer
        pp_kwargs: *pp_kwargs
        shard_dataset: !var [ "shard_dataset", False ]
        select_range: !var [ "select_range", null ]
        shuffle: !var [ "shuffle", False ]
        seed: !var [ "seed", 42 ]
    project_dir: "{{ project_dir }}"
    config_template: "Python-Code-Large.yaml"
    targets: [ "train_dataset", "eval_dataset", "test_dataset" ]

    [cpp_code]
.define: &cpp_code !call:forgather:from_project
    <<: *dataset_args
    project_dir: "{{ project_dir }}"
    config_template: "Cpp-Code-Large.yaml"
    targets: [ "train_dataset", "eval_dataset", "test_dataset" ]

    [c_code]
.define: &c_code !call:forgather:from_project
    <<: *dataset_args
    project_dir: "{{ project_dir }}"
    config_template: "C-Code-Large.yaml"
    targets: [ "train_dataset", "eval_dataset", "test_dataset" ]

    [javascript_code]
.define: &javascript_code !call:forgather:from_project
    <<: *dataset_args
    project_dir: "{{ project_dir }}"
    config_template: "JavaScript-Code-Large.yaml"
    targets: [ "train_dataset", "eval_dataset", "test_dataset" ]

    [train_dataset]
train_dataset: &train_dataset !singleton:forgather.ml.datasets:interleave_datasets
    <<: &interleave_args
        probabilities: !partial:forgather.ml.datasets:balance_remaining_examples
        seed: 42
        stopping_strategy: "all_exhausted"
    datasets:
        - !call:getitem [ *python_code, 'train_dataset' ]
        - !call:getitem [ *cpp_code, 'train_dataset' ]
        - !call:getitem [ *c_code, 'train_dataset' ]
        - !call:getitem [ *javascript_code, 'train_dataset' ]

    [eval_dataset]
eval_dataset: !singleton:forgather.ml.datasets:interleave_datasets
    <<: *interleave_args
    datasets:
        - !call:getitem [ *python_code, 'eval_dataset' ]
        - !call:getitem [ *cpp_code, 'eval_dataset' ]
        - !call:getitem [ *c_code, 'eval_dataset' ]
        - !call:getitem [ *javascript_code, 'eval_dataset' ]

    [test_dataset]
test_dataset: !singleton:forgather.ml.datasets:interleave_datasets
    <<: *interleave_args
    datasets:
        - !call:getitem [ *python_code, 'test_dataset' ]
        - !call:getitem [ *cpp_code, 'test_dataset' ]
        - !call:getitem [ *c_code, 'test_dataset' ]
        - !call:getitem [ *javascript_code, 'test_dataset' ]
