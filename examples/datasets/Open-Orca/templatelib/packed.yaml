-- macro map_function(orca_src, chat_template_path, max_length, stride)
## Note: Values in "preprocess_args" override the defaults specified here.
.define: &map_function !partial:{{ orca_src }}:orca_packed_map_fn
    chat_template: !singleton:{{ orca_src }}:load_chat_template
        path: "{{ chat_template_path }}"
    max_length: {{ max_length }}
    overflow: False
    packed: True
    packing_strategy: "best_fit"
    shuffle_output: True
    stride: {{ stride }}
    min_len: 32
    add_bos: True
    add_eos: True
-- endmacro


-- macro map_kwargs()
    batch_size: 1000
-- endmacro


-- macro dynamic_args()
    max_length:
        names: "--max-length"
        type: "int"
        help: "Maximum length of output sequences."
    stride:
        names: "--stride"
        type: "int"
        help: "Number of tokens to repeat from previous overflowing example."
-- endmacro
