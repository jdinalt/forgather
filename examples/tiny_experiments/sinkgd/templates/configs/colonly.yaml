-- extends "exp.yaml"

[config_metadata]
    == super()
    -- set ns.config_name = "SinkGD (col_only embed)"
    -- set ns.config_description = "SinkGD with col_only mode for embed"
    -- set ns.log_name = log_name | default("colonly")

[optimizer_groups]
    == super()
    embed:
        regex: 'embed'
        config:
            mode: "col_only"
            lr: {{ ns.sinkgd_lr }}
            weight_decay: 0.0