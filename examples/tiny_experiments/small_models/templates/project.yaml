-- extends 'projects/small.yaml'

[config_metadata]
    == super()
    ## Training budget: double the small baseline (500M -> 1000M tokens) and
    ## reserve 10% of the budget for a WSD annealing (decay) phase. With
    ## annealing_tokens > 0 the base computes decay_start_step =
    ## total_steps - annealing_steps, so the LR anneals to min_lr over the
    ## final 100M tokens and finishes exactly at the last step. (0 would
    ## disable the decay phase entirely.)
    -- set ns.total_tokens = total_tokens | default(1000)
    -- set ns.annealing_tokens = annealing_tokens | default(100)

## Warmup-Stable-Decay LR schedule (matches the tiny_experiments/diloco
## example): constant LR after warmup, then a cosine-style anneal to min_lr
## over the final annealing_tokens. decay_start_step / annealing_steps are
## computed in the base from the budget above.
[lr_scheduler]
lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:WSDScheduler@lr_scheduler
    warmup_steps: {{ ns.warmup_steps }}
    min_lr: {{ ns.min_lr | toyaml }}
    decay_steps: {{ ns.annealing_steps }}
    decay_start_step: {{ ns.decay_start_step }}

[trainer_args]
    == super()
    # Project Overrides
    save_strategy: "steps" # Save models when done
