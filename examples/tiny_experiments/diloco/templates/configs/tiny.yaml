-- extends "projects/tinyv2.yaml"

## Tiny Experiments / DiLoCo. ``enable_diloco = True`` forces
## template rendering as DiLoCo-enabled — the parent
## (``lm_training_project.yaml`` via tinyv2) owns all the actual
## wiring (callback, work-unit dispatch on train, conditional
## from_pretrained_config model construction, --diloco-* CLI args,
## worker-id-suffixed output dir).
##
## NB: ``enable_diloco`` is a RENDER-TIME signal. Running this config
## still requires ``DILOCO_SERVER`` to be set in the worker env
## (preprocess_dataset's validity check rejects ``work_units`` without
## it). Set DILOCO_SERVER via the scheduler / launcher when actually
## training; the flag here lets ``forgather pp`` / ``ls`` show the
## DiLoCo-enabled rendering without spinning up a server.


[config_metadata]
    == super()
    -- set ns.config_name = "DiLoCo Training (Tiny)"
    -- set ns.config_description = "Tiny model with DiLoCo distributed local-SGD"
    -- set ns.log_name = "diloco"

    -- set ns.enable_diloco = enable_diloco | default(True)

    -- set ns.base_save_tokens = 100

[lr_scheduler]
lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:WSDScheduler@lr_scheduler
    warmup_steps: {{ ns.warmup_steps }}
    min_lr: {{ ns.min_lr | toyaml }}
    decay_steps: {{ ns.annealing_steps }}
    decay_start_step: {{ ns.decay_start_step }}
