## DiLoCo with the "small" Llama base on Fineweb-Edu Packed.
##
## Sized for cross-host DiLoCo testing where each host runs DDPx2
## (or larger) — exercises the shared work-unit dispatch queue
## across asymmetric or symmetric DDP topologies. Each worker's
## within-host parallelism is DDP; across-host coordination is
## DiLoCo. The shared queue keyed by (dataset_id, shuffle_seed)
## hands out work units to all DDP ranks across all DiLoCo hosts.

