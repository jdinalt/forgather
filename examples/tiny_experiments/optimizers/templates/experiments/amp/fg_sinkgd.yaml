-- extends 'project.yaml'
## Gradient Multi-Normalization for Stateless and Scalable LLM Training
## https://arxiv.org/pdf/2502.06742
[config_metadata]
    == super()
    -- set ns.config_name = "SinkGD"
    -- set ns.config_description = "SinkGD"
    -- set ns.log_name = log_name | default("sinkgd")

    -- set ns.base_lr = lr | default(0.02)
    -- set ns.sinkgd_alpha = sinkgd_alpha | default(0.05)

[globals]
    == super()
    -- set ns.sinkgd_lr = ns.global_lr * ns.sinkgd_alpha

[variable_listing]
    == super()
# ns.sinkgd_lr: {{ ns.sinkgd_lr }}
# ns.sinkgd_alpha: {{ ns.sinkgd_alpha }}

[optimizer]
    [sinkgd]
.define: &sinkgd !partial:forgather.ml.optim.sinkgd:SinkGD
    lr: {{ ns.sinkgd_lr | toyaml }}
    num_iters: 5
    normalize_output: False

    [multiopt]
optimizer: &optimizer !partial:forgather.ml.optim.multiopt:make_re_multiopt
    optimizer_map:
        - [ "embed|lm_head|norm|bias", "adam" ]
        - [ ".*", "sinkgd" ]
    factories:
        sinkgd: *sinkgd
        adam: !partial:torch.optim:Adam
            lr: {{ ns.global_lr | toyaml }}
            weight_decay: !!float 0.0
    debug: True

[dynamic_args]
    == super()
    sinkgd_alpha:
        names: "--sinkgd-alpha"
        type: float
        help: "SinkGD Alpha"

