## FSDP2 Trainer sharded checkpoint save test - train for 500 steps
-- extends "project.yaml"

[config_metadata]
    == super()
    -- set ns.config_name = "FSDP2 Checkpoint Train"
    -- set ns.config_description = "Train FSDP2Trainer for 500 steps with sharded checkpointing"
    -- set ns.log_name = "fsdp2_checkpoint"

[trainer_args]
    == super()

    save_strategy: "steps"
    eval_strategy: "steps"
    save_steps: 200
    eval_steps: 100
    logging_steps: 50
    save_safetensors: True
    save_total_limit: 3

    max_steps: 500

    per_device_train_batch_size: 8
    per_device_eval_batch_size: 16
