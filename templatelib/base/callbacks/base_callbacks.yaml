-- set callbacks_ns = namespace()
-- from 'inc/formatting.jinja' import h3

== h3('Dependencies')

[callback_dependencies]
## Undefined
[step_columns]
## Step-log columns: dict mapping metric key -> {label, width, fmt}.
## fmt accepts a Python format spec (".5f", ",d"), a named formatter
## ("si", "gib"), or a callable via !partial for custom formatting.
## Omit step_columns entirely to use defaults (all standard columns).
## Child templates can override individual columns via == super(), or
## erase a column by setting its value to ~ (null).
.define: &step_columns
    epoch:
        label: "epoch"
        width: 8
        fmt: ".4g"
    loss:
        label: "loss"
        width: 8
        fmt: ".5f"
    grad_norm:
        label: "grad"
        width: 8
        fmt: ".4f"
    learning_rate:
        label: "lr"
        width: 10
        fmt: ".2e"
    tokens:
        label: "tokens"
        width: 10
        fmt: ",d"
    total_tokens:
        label: "total_tok"
        width: 10
        fmt: "si"
    tok_per_sec:
        label: "tok/s"
        width: 10
        fmt: ",d"
    mfu:
        label: "mfu"
        width: 6
        fmt: ".1%"
    peak_mem:
        label: "peak_mem"
        width: 11
        fmt: "gib"

[callback_list_definition]
== h3('Callback List')

    [callback_list]
trainer_callbacks: &trainer_callbacks !dlist:@trainer_callbacks
    progress_callback: !singleton:forgather.ml.trainer.callbacks:ProgressCallback
        use_tqdm: null # Optional[bool] : Use TQDM, Auto, if unspecified
        output_stream: "stdout" #Literal["stderr", "stdout"]
        step_columns: *step_columns
    info_callback: !singleton:forgather.ml.trainer.callbacks:InfoCallback
        verbose: {{ verbose_info | default(False) }}