## Mixin: DiLoCo distributed local-SGD training strategy.
##
## Provides per-section macros for the DiLoCo augmentations. DiLoCo
## is orthogonal to training context (pretrain vs finetune) — compose
## with a context mixin (or none) by importing both and calling each
## contributing macro inside the matching section of your leaf.
##
## Convention: macros emit YAML text only. Namespace mutation
## (e.g. the per-worker ns.output_dir suffix) stays in the leaf
## project — ``lm_training_project.yaml`` is the canonical example.
##
## **Import with context**: callers must use
## ``{% from "mixins/diloco.yaml" import … with context %}``. Without
## ``with context`` the macro can't see the caller's Jinja variables,
## so ``-- set diloco_worker_id = 'w0'`` in a leaf would render as
## ``worker_id: null`` instead of ``w0``. The current Forgather
## dynamic-args also need the context to flow through.
##
## Activation: the ``DILOCO_SERVER`` env var — set by ``forgather diloco
## worker`` and by the webui scheduler when DiLoCo is enabled (or a
## ``diloco_server`` template var, if a caller passes one). When neither is
## set the callback is gated off by the leaf and the same config behaves as
## a vanilla training run.

-- macro callback_entry()
    ## DiLoCo callback. Client-local DILOCO_* env vars are read by the
    ## callback constructor when these args are None; the webui sets them
    ## based on the operator's selections.
    ##
    ## sync_every / bf16_comm / dylu / num_fragments are intentionally
    ## absent: they must match across the group, so the server is their
    ## sole authority and the worker reads them from the server's /info at
    ## startup (no client override).
    diloco_callback: !singleton:forgather.ml.trainer.callbacks:DiLoCoCallback
        server_addr: {{ diloco_server | toyaml(None) }}
        worker_id: {{ diloco_worker_id | toyaml(None) }}
        heartbeat_interval: {{ diloco_heartbeat_interval | toyaml(None) }}
        timeout: {{ diloco_timeout | toyaml(600) }}
        max_sync_retries: {{ diloco_max_sync_retries | toyaml(3) }}
-- endmacro


## NOTE: there is intentionally no ``dynamic_args()`` macro. The DiLoCo
## worker knobs (server address, worker id, heartbeat interval) are
## worker-launch concerns, not general training-config knobs: they are set
## by ``forgather diloco worker`` and by the webui's dedicated DiLoCo
## interface, both via the ``DILOCO_*`` env vars that ``callback_entry``'s
## constructor reads when its args are None. ``callback_entry`` still
## honors ``diloco_server`` / ``diloco_worker_id`` /
## ``diloco_heartbeat_interval`` if a caller passes them as template vars
## (``toyaml(None)`` → None when undefined), but they're no longer surfaced
## as ``--diloco-*`` CLI flags on every training config.
