-- extends "training_script/causal_lm/causal_lm.yaml"
## ---------------------------------------------------------------------------
## LM Training Project
##
## A complete training project template that computes the number of training
## steps from a target token budget. The budget is typically set relative to
## the "Chinchilla-Optimal" ratio (see background below).
##
## Includes a cosine-decay LR scheduler with warmup and an AdamW optimizer
## with automatic LR scaling based on global batch size. This allows you to
## change the batch size, number of GPUs, or gradient accumulation steps
## without manually retuning the learning rate. The scaling uses a power-law
## rule:
##
##   lr = base_lr * (global_batch_size / base_batch_size) ** alpha
##
## ---------------------------------------------------------------------------
## Configuration Parameters
##
## All token counts are specified in MILLIONS unless noted otherwise.
##
## Training Budget
##   total_tokens           (int)   Total training tokens.          Default: 560
##   warmup_tokens          (int)   LR warmup tokens.               Default: 56
##   min_cooldown_tokens    (int)   Minimum cosine-decay window;    Default: 300
##                                  prevents decay to 0 on short runs.
##
## Batching
##   seq_len                (int)   Maximum sequence length.        Default: 512
##   batch_size             (int)   Per-device training batch size. Default: 32
##   gradient_accumulation_steps
##                          (int)   Gradient accumulation steps.    Default: 1
##   batch_density          (float) Estimated fraction of non-pad   Default: 0.90
##                                  tokens per batch; used to
##                                  correct token-count estimates.
##
## Data
##   dataset_project        (path)  Path to dataset project.        Default: examples/datasets/HuggingFaceTB
##   dataset_config         (str)   Dataset project configuration.  Default: smollm-corpus/fineweb-edu-packed.yaml
##   dispatch_batches       (bool)  When True, rank-0 loads and     Default: False
##                                  dispatches all batches (DDP).
##                                  Prefer False for throughput:
##                                  centralised loading adds per-step
##                                  dispatch overhead and serialises
##                                  data loading on rank-0. Enable only
##                                  when (a) the dataset doesn't support
##                                  sharding, or (b) you need the DDP run
##                                  to see the same example sequence as
##                                  a single-GPU / pipeline run so that
##                                  training curves are directly
##                                  comparable.
##
## Model
##   model_project          (path)  Path to model project.          Default: examples/models/llama
##   model_config           (str)   Model project configuration.    Default: small.yaml (28M parameters)
##   attn_implementation    (str)   Attention backend.              Default: sdpa
##
## Optimizer / Scheduler / LR Scaling
##   lr                     (float) Base learning rate at           Default: 3e-4
##                                  base_batch_size.
##   base_batch_size        (int)   Reference batch size (tokens)   Default: 16384
##                                  for LR scaling calculation.
##   lr_alpha               (float) Scaling exponent.               Default: 0.5
##                                    0.0 = no scaling
##                                    0.5 = sqrt (noise-dominated)
##                                    1.0 = linear (signal-dominated)
##
## Trainer Selection
##   trainer_type           (str)   Trainer backend.                Choices: basic, ddp, fsdp2, pipeline
##                                                                  Default: basic
##   nproc_per_node         (str|int) Processes per node.           Default: auto (1 for basic,
##                                                                           "gpu" for ddp/fsdp2/pipeline)
##   pipeline_schedule      (str)   PP schedule class.              Default: ScheduleInterleaved1F1B
##   microbatch_scale       (int)   PP microbatch scale factor.     Default: 1
##
## Step Cadence (logging / eval / save intervals)
##   step_cadence           (float) Multiplier applied to the base  Default: 1.0
##                                  token intervals below.
##   base_logging_tokens    (int)   Tokens (M) between log steps.   Default: 1
##   base_validation_tokens (int)   Tokens (M) between eval steps.  Default: 25
##   base_save_tokens       (int)   Tokens (M) between save steps.  Default: 500
##
## Hardware / Performance
##   peak_hardware_flops    (float) Peak device FLOPS for MFU       Default: auto-detected
##                                  computation. Auto-detected from
##                                  the current GPU, or read from
##                                  ~/.forgather/hardware.yaml.
##                                  See docs/trainers/training-performance-metrics.md
##
## Precision / Compilation
##   default_dtype          (str)   Torch dtype for model construction. Choices: float32, bfloat16, float16
##   float32_matmul_precision
##                          (str)   Approximate float32 matmul with bf16. Choices: highest, high, medium
##   mixed_precision        (str)   AMP dtype.                      Choices: bf16, fp16, no
##   fp8_recipe             (str)   FP8 recipe for linear layers.   Choices: tensorwise, rowwise, rowwise_with_gw_hp
##   compile                (bool)  Enable torch.compile.           Default: False
##   torch_compile_mode     (str)   torch.compile mode.             Default: default
##                                  Choices: default, max-autotune, max-autotune-no-cudagraphs.
##                                  max-autotune is incompatible with gradient accumulation
##                                  and pipeline parallel; use max-autotune-no-cudagraphs
##                                  instead. Zero-bubble pipeline schedules are incompatible
##                                  with torch_compile entirely.
##
## Memory / Performance
##   gradient_checkpointing (bool)  Enable activation checkpointing Default: False
##                                  on models that implement the HF
##                                  gradient-checkpointing API.
##                                  Trades extra recompute for lower
##                                  peak activation memory.
##   activation_offloading  (bool)  Offload saved activations to    Default: False
##                                  CPU memory during backward. Pair
##                                  with gradient_checkpointing for
##                                  maximum memory savings.
##   activation_memory_budget
##                          (float) Fraction passed to torch._functorch
##                                  activation_memory_budget. Requires
##                                  compile=True. See
##                                  https://pytorch.org/blog/activation-checkpointing-techniques
##   fuse_optim_with_backward
##                          (bool)  Apply optimizer updates inside  Default: False
##                                  the backward grad hook so each
##                                  gradient is consumed and freed
##                                  immediately. Supported by the
##                                  basic and pipeline trainers.
##                                  Incompatible with DDP/Accelerate
##                                  (they need gradients intact for
##                                  the all-reduce step), with
##                                  max_grad_norm gradient clipping
##                                  (clipping needs the full gradient
##                                  vector before any update),
##                                  gradient_accumulation_steps > 1,
##                                  and fp16 AMP.
##   construct_model_on     (str)   Where to build the model.       Default: default
##                                  Choices: default, device, meta.
##                                    default: build on CPU, move to device.
##                                    device:  build directly on device.
##                                    meta:    build on meta then materialize empty
##                                             on device. If no checkpoint is
##                                             available the basic trainer falls
##                                             back to CPU construction
##                                             automatically. Ignored by the
##                                             pipeline trainer, which always
##                                             constructs on meta (with rank-0
##                                             doing a one-time CPU
##                                             initialisation + dispatch when no
##                                             checkpoint is present).
##   gc_threshold           (float) Ratio of allocated-to-total GPU Default: 0.9
##                                  memory at which to run empty_cache
##                                  and (conditionally) gc.collect.
##                                  Real trade-off: too low and frequent
##                                  cache flushes slow training (each
##                                  flush synchronises the CUDA stream);
##                                  too high and you OOM from allocator
##                                  fragmentation. Tune against the
##                                  OOM edge.
##
## Misc
##   seed                   (int)   Random seed.                    Default: 42
##   resume                 (bool)  Resume from latest checkpoint.  Default: True
##   save_strategy          (str)   Checkpoint save strategy.       Default: steps
##
## See docs/trainers/trainer_options.md for the complete list of options
## supported by each trainer and full descriptions of their semantics.
##
## ---------------------------------------------------------------------------
## Batch-Size / Learning-Rate Scaling: Background
##
## The transition between scaling regimes is governed by the critical batch
## size B_crit, which can be estimated from the gradient noise scale:
##
##   B_simple ~ tr(Sigma) / ||G||^2
##
## where G is the mean gradient and Sigma is the per-example gradient
## covariance. Practically, B_simple can be estimated cheaply by computing
## gradient norms at two batch sizes (e.g., B=1 and B=64) and taking their
## ratio -- see McCandlish et al. (2018) Appendix A for the exact estimator.
##
## When batch_size << B_crit (signal-dominated), each sample contributes
## fresh gradient signal, so linear scaling (alpha=1.0) is appropriate.
## When batch_size >> B_crit (noise-dominated), additional samples mainly
## reduce gradient noise, so sqrt scaling (alpha=0.5) is appropriate.
##
## Caveats:
##   - B_crit increases over training as "easy" gradient signal is exhausted,
##     suggesting batch size warmup as a practical strategy.
##   - The noise scale proxy relies on SGD + well-conditioned gradient
##     assumptions; recent work (Mayberry et al., 2025) finds it can
##     underestimate B_crit by orders of magnitude for Adam on LLMs, so
##     treat it as a rough lower bound.
##
## References:
##   McCandlish et al. (2018) "An Empirical Model of Large-Batch Training"
##     https://arxiv.org/abs/1812.06162
##   Mayberry et al. (2025) "Critical Batch Size Revisited"
##     https://arxiv.org/abs/2505.23971
##
## ---------------------------------------------------------------------------
## Chinchilla-Optimal Training: Background
##
## The "Chinchilla scaling law" (Hoffmann et al., 2022) empirically determined
## that prior large language models were significantly *undertrained* relative
## to their parameter count. The key finding: for a compute-optimal model,
## training tokens should scale *linearly* with model parameters -- roughly
## 20 tokens per parameter.
##
##   Optimal tokens ~ 20 x N
##   where N = number of model parameters
##
## This overturned the earlier Kaplan et al. (2020) wisdom, which favoured
## scaling parameters over data given a fixed compute budget (FLOPs).
## Hoffmann et al. showed that halving model size while doubling tokens yields
## equal or better loss at the same compute cost -- as demonstrated by
## Chinchilla (70B params, 1.4T tokens) outperforming Gopher (280B params,
## 300B tokens) despite using ~4x fewer parameters.
##
## Practical derivation:
##   C ~ 6 x N x D          (approximate FLOPs for a transformer fwd+bwd pass)
##   Minimise L(N, D) s.t. C = 6ND  =>  N_opt ~ C^0.5,  D_opt ~ C^0.5
##   Fitted constant from Hoffmann et al.: D_opt ~ 20 x N_opt
##
## Caveats:
##   - The "20x" ratio is a fitted constant; Epoch AI (2024) and others
##     suggest the true optimum may be higher (~40-100x) once inference costs
##     are factored in.
##   - Assumes a fixed compute budget; if data is the bottleneck, the ratio
##     shifts.
##   - Applies to autoregressive transformer LLMs; may not generalise to other
##     architectures or modalities.
##
## References:
##   Hoffmann et al. (2022) "Training Compute-Optimal Large Language Models"
##     https://arxiv.org/abs/2203.15556
##   Kaplan et al. (2020) "Scaling Laws for Neural Language Models"
##     https://arxiv.org/abs/2001.08361
##   Besiroglu et al. / Epoch AI (2024) "Chinchilla Scaling: A Replication Attempt"
##     https://arxiv.org/abs/2404.10102
## ---------------------------------------------------------------------------
##
