## DiLoCo + loggers callback set. Extends the base loggers template
## and appends the DiLoCo parameter-sync callback. Used by
## ``[trainer_callbacks]`` above when DiLoCo is enabled. Kept minimal
## — does NOT pull in lm_callbacks (text-gen, divergence detector,
## etc.); leaves that want those override [trainer_callbacks] to
## include lm_callbacks instead, and lm_callbacks itself has its own
## DiLoCo gate so DiLoCo composes either way.
-- extends 'callbacks/loggers.yaml'
{% from "mixins/diloco.yaml" import callback_entry as dl_callback_entry with context %}

[callback_list]
    => super()
{{ dl_callback_entry() }}
