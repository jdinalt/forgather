## ===== Dataset ==============================================================
##
[datasets_preprocessor_args]
.define: &tokenizer_args !dict
    truncation: True
    max_length: {{ ns.seq_len }}

[datasets_definition]
    [dataset_project_pp_args]
.define: &dataset_project_pp_args !dict

    [eval_dataset_project_pp_args]
.define: &eval_dataset_project_pp_args !dict

    [dataset_project]
.define: &dataset_dict !call:forgather:from_project
    project_dir: "{{ ns.dataset_proj }}"
    config_template: "{{ ns.dataset_config }}"
    targets: [ "train_dataset" ]
    pp_kwargs: *dataset_project_pp_args
    <<: &common_dataset_args
        preprocess_args: *tokenizer_args
        tokenizer: *tokenizer
    ## Train partitioning. Under DiLoCo: work-unit dispatch (server
    ## hands out row ranges; all DDP ranks across all hosts share one
    ## queue, so asymmetric DDPx4 / DDPx8 hosts compose cleanly).
    ## Otherwise: conventional DDP shard when not dispatching batches.
    ## NB: ``shard_dataset`` is intentionally a SIBLING of ``<<:`` (4
    ## spaces, same as ``<<:`` itself) so it overrides any value the
    ## merge would otherwise pull in — common_dataset_args no longer
    ## carries shard_dataset because train and eval pick different
    ## values under DiLoCo.
    -- if ns.diloco_is_enabled
    shard_dataset: { method: "work_units" }
    -- else
    shard_dataset: {{ ns.dispatch_batches == False }}
    -- endif

    [eval_dataset_project]
.define: &eval_dataset_dict !call:forgather:from_project
    project_dir: "{{ ns.eval_dataset_proj }}"
    config_template: "{{ ns.eval_dataset_config }}"
    targets: [ "eval_dataset" ]
    pp_kwargs: *eval_dataset_project_pp_args
    <<: *common_dataset_args
    ## Eval partitioning is independent of DiLoCo. Eval is replicated
    ## across DiLoCo workers (every host runs the full eval; metrics
    ## are averaged across hosts) and we WANT within-host DDP
    ## sharding to split the eval workload across the DDP ranks of
    ## each host — without it, every DDP rank runs the full eval
    ## locally, burning W× compute for an identical result.
    ## ``partition_purpose: "eval"`` (stamped per-singleton by
    ## load_dataset.yaml) lets preprocess_dataset's validity check
    ## allow conventional + DiLoCo here without complaint.
    shard_dataset: {{ ns.dispatch_batches == False }}

    [dataset_splits]
train_dataset: &train_dataset !call:getitem [ *dataset_dict, 'train_dataset' ]
eval_dataset: &eval_dataset !call:getitem [ *eval_dataset_dict, 'eval_dataset' ]

## ===== Model ================================================================
##
[model_constructor_args]
.define: &model_constructor_args
    attn_implementation: "{{ ns.attn_implementation }}"

[construct_new_model]
    ## Under DiLoCo, the include emits ``&tokenizer`` and ``&model`` from
    ## the server's model-definition bundle (issue #53): it stages config +
    ## custom code + tokenizer into the worker's output dir and builds the
    ## model empty on meta. Every worker therefore builds the *same* model
    ## the server holds (no shared filesystem, no mismatched-architecture
    ## foot-gun), and the parameter sync supplies the shared weights. The
    ## sub-blocks below emit nothing under DiLoCo so the non-DiLoCo
    ## construct-via-model_project path is skipped.
    -- if ns.diloco_is_enabled
    -- include 'models/from_diloco_server.yaml'
    -- endif

    [model_project_pp_args]
    -- if not ns.diloco_is_enabled
.define: &model_project_pp_args
    output_dir: "{{ ns.output_dir }}"
    -- endif

    [model_project]
    -- if not ns.diloco_is_enabled
.define: &model_dict !call:forgather:from_project
    project_dir: "{{ ns.model_project_dir }}"
    config_template: "{{ ns.model_project_config }}"
    targets: [ "pretrained_tokenizer", "model" ]
    pp_kwargs: *model_project_pp_args
    model_constructor_args: *model_constructor_args
    -- endif

    [model_assets]
    -- if not ns.diloco_is_enabled
tokenizer: &tokenizer !call:getitem [ *model_dict, 'pretrained_tokenizer' ]
model: &model !call:getitem [ *model_dict, 'model' ]
    -- endif

## ===== Trainer ==============================================================
##
[trainer_args]
    == super()
    seed: {{ seed | toyaml(42) }}
    eval_strategy: steps
    save_strategy: {{ save_strategy | toyaml('steps') }}

    logging_steps: {{ (ns.logging_tokens // ns.tokens_per_step) | int }}
    eval_steps: {{ (ns.validation_tokens // ns.tokens_per_step) | int }}
    save_steps: {{ (ns.save_tokens // ns.tokens_per_step) | int }}
    max_steps: {{ max_steps | toyaml(ns.total_steps) }}

    per_device_train_batch_size: {{ ns.per_device_train_batch_size }}
    per_device_eval_batch_size: {{ ns.per_device_train_batch_size * 2 }}  # 2x train batch size
    gradient_accumulation_steps: {{ ns.gradient_accumulation_steps }}

    resume_from_checkpoint: {{ resume | default(True) }}
    torch_compile: {{ ns.torch_compile }}
    torch_compile_mode: {{ ns.torch_compile_mode }}
    dispatch_batches: {{ ns.dispatch_batches }}
    float32_matmul_precision: {{ float32_matmul_precision | toyaml(None) }}
    default_dtype: {{ default_dtype | toyaml(None) }}
    mixed_precision: {{ mixed_precision | toyaml(None) }}
    fp8_recipe: {{ fp8_recipe | toyaml(None) }}
    qat_recipe: {{ qat_recipe | toyaml(None) }}
    gradient_checkpointing: {{ gradient_checkpointing | default(False) }}
    fuse_optim_with_backward: {{ fuse_optim_with_backward | default(False) }}
    enable_activation_offloading: {{ activation_offloading | default(False) }}
    dataloader_drop_last: True
    ## Under DiLoCo the parameter server owns the model weights: the worker
    ## builds the model empty on meta (allocation-free) and fills it from the
    ## sync at register, and its checkpoints carry training state but NOT
    ## model weights. ``checkpoint_components`` excluding "model" drives both
    ## (the trainer reads it as "weights are external"); it is overridable by
    ## a child template / leaf that sets ``checkpoint_components``.
    ##
    ## "dataset" is also excluded: dataset position is tracked by the DiLoCo
    ## server via work-units, not the local dataloader, so a local dataset
    ## checkpoint would be stale/misleading on resume.
    -- if ns.diloco_is_enabled
    construct_model_on: meta
    checkpoint_components: {{ checkpoint_components | toyaml(["optimizer", "scheduler", "trainer", "rng"]) }}
    -- else
    construct_model_on: {{ construct_model_on | toyaml("default") }}
    -- if checkpoint_components is defined and checkpoint_components
    checkpoint_components: {{ checkpoint_components | toyaml }}
    -- endif
    -- endif
    activation_memory_budget: {{ activation_memory_budget | toyaml(None) }}
    gc_threshold: {{ gc_threshold | default(0.9) }}
    save_safetensors: {{ save_safetensors | default(False) }}
    debug_optimizer_groups: {{ debug_optimizer_groups | default(False) }}
    max_grad_norm: {{ max_grad_norm | toyaml(None) }}

-- if ns.trainer_type == "pipeline"
    # Pipeline Parallel
    n_microbatches: {{ ns.n_microbatches }}
    is_multistage: {{ (ns.stages_per_rank > 1) | toyaml }}
    stages_per_rank: {{ ns.stages_per_rank }}
    pp_stage_type: {{ ns.pp_stage_type | toyaml }}
    per_device_train_batch_size: {{ ns.pp_batch_size }}
    per_device_eval_batch_size: {{ ns.pp_batch_size }}
    dispatch_batches: null
-- endif

[trainer_definition]
    -- include ns.trainer_class

[datacollator]
data_collator: &data_collator !singleton:forgather.ml.data_collator:DataCollatorForCausalLM@DataCollatorForCausalLM
    tokenizer: *tokenizer
    return_tensors: pt

[lr_scheduler]
# LR Scheduler (cosine decay with warmup)
# total_steps is clamped to min_cooldown_steps ({{ ns.min_cooldown_steps }})
# so that short runs do not decay the LR all the way to zero.
lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:CosineLRScheduler@lr_scheduler
    warmup_steps: {{ ns.warmup_steps }}
    total_steps: {{ [ns.min_cooldown_steps, ns.total_steps] | max | int }}
    min_lr: {{ ns.min_lr | toyaml }}

[optimizer]
optimizer: &optimizer !partial:torch:optim.AdamW
    lr: {{ ns.global_lr | toyaml }}

[optimizer_factories]
    ## Block for extending
    [optimizer_factories_]
    [no_decay_optim]
.define: &no_decay_optim ~

[optimizer_groups]
optimizer_groups: &optimizer_groups
    no_decay:
        regex: 'norm|bias|embed|lm_head|alibi_slopes'
        config:
            weight_decay: 0.0
        factory: *no_decay_optim

## ===== Callbacks (DiLoCo-only injection) ====================================
##
## This project does NOT include ``callbacks/lm_callbacks.yaml`` —
## that's a deliberate design choice so leaves can pick their own
## callback set without inheriting the full LM suite (text-gen,
## divergence detector, etc.). The parent (``causal_lm.yaml``)
## supplies just the base loggers; leaves can override
## ``[trainer_callbacks]`` to add lm_callbacks or anything else.
##
## However, the DiLoCo parameter-sync callback IS pulled in here
## conditionally — it's the cross-cutting concern that pairs with
## the work-unit dispatch, the worker-id suffix, and the
## ``--diloco-*`` CLI args we already provide. Under DiLoCo the
## callback is required; without it, the workers never sync.
##
## Mechanics: Forgather's ``[callback_list]`` block inheritance only
## flows through ``-- extends`` chains, not across ``-- include``
## boundaries, so we can't override [callback_list] at this scope.
## Instead, when DiLoCo is enabled, the [trainer_callbacks] block
## includes a sub-template (defined at the bottom of this file)
## that extends loggers.yaml and appends the DiLoCo callback. Leaves
## that override [trainer_callbacks] with their own callback set
## (e.g. tinyv2.yaml uses lm_callbacks.yaml) shadow this gate — those
## callback files have their own DiLoCo gate (lm_callbacks.yaml does)
## so DiLoCo still flows in through that path.
[trainer_callbacks]
    -- if ns.diloco_is_enabled
    -- include 'lm_training_project_diloco_loggers'
    -- else
    -- include 'callbacks/loggers.yaml'
    -- endif


