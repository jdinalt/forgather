## ===== Dataset ==============================================================
##
[datasets_preprocessor_args]
.define: &tokenizer_args !dict
    truncation: True
    max_length: {{ ns.seq_len }}

[datasets_definition]
    [dataset_project_pp_args]
.define: &dataset_project_pp_args !dict

    [dataset_project]
.define: &dataset_dict !call:forgather:from_project
    project_dir: "{{ ns.dataset_proj }}"
    config_template: "{{ ns.dataset_config }}"
    targets: [ "train_dataset", "eval_dataset" ]
    pp_kwargs: *dataset_project_pp_args
    preprocess_args: *tokenizer_args
    tokenizer: *tokenizer
    shard_dataset: {{ ns.dispatch_batches == False }}

    [dataset_splits]
train_dataset: &train_dataset !call:getitem [ *dataset_dict, 'train_dataset' ]
eval_dataset: &eval_dataset !call:getitem [ *dataset_dict, 'eval_dataset' ]

## ===== Model ================================================================
##
[model_constructor_args]
.define: &model_constructor_args
    attn_implementation: "{{ ns.attn_implementation }}"

[construct_new_model]
    [model_project_pp_args]
.define: &model_project_pp_args
    output_dir: "{{ ns.output_dir }}"

    [model_project]
.define: &model_dict !call:forgather:from_project
    project_dir: "{{ ns.model_project_dir }}"
    config_template: "{{ ns.model_project_config }}"
    targets: [ "pretrained_tokenizer", "model" ]
    pp_kwargs: *model_project_pp_args
    model_constructor_args: *model_constructor_args

    [model_assets]
tokenizer: &tokenizer !call:getitem [ *model_dict, 'pretrained_tokenizer' ]
model: &model !call:getitem [ *model_dict, 'model' ]

## ===== Trainer ==============================================================
##
[trainer_args]
    == super()
    seed: {{ seed | toyaml(42) }}
    eval_strategy: "steps"
    save_strategy: {{ save_strategy | toyaml('steps') }}

    logging_steps: {{ (ns.logging_tokens // ns.tokens_per_step) | int }}
    eval_steps: {{ (ns.validation_tokens // ns.tokens_per_step) | int }}
    save_steps: {{ (ns.save_tokens // ns.tokens_per_step) | int }}
    max_steps: {{ max_steps | toyaml(ns.total_steps) }}

    per_device_train_batch_size: {{ ns.per_device_train_batch_size }}
    per_device_eval_batch_size: {{ ns.per_device_train_batch_size * 2 }}  # 2x train batch size
    gradient_accumulation_steps: {{ ns.gradient_accumulation_steps }}

    resume_from_checkpoint: {{ resume | default(True) }}
    torch_compile: {{ ns.torch_compile }}
    torch_compile_mode: {{ ns.torch_compile_mode }}
    dispatch_batches: {{ ns.dispatch_batches }}
    float32_matmul_precision: {{ float32_matmul_precision | toyaml(None) }}
    default_dtype: {{ default_dtype | toyaml(None) }}
    mixed_precision: {{ mixed_precision | toyaml(None) }}
    fp8_recipe: {{ fp8_recipe | toyaml(None) }}
    gradient_checkpointing: {{ gradient_checkpointing | default(False) }}
    fuse_optim_with_backward: {{ fuse_optim_with_backward | default(False) }}
    enable_activation_offloading: {{ activation_offloading | default(False) }}
    dataloader_drop_last: True
    construct_model_on: {{ construct_model_on | toyaml("default") }}
    activation_memory_budget: {{ activation_memory_budget | toyaml(None) }}
    gc_threshold: {{ gc_threshold | default(0.9) }}
    save_safetensors: {{ save_safetensors | default(False) }}

-- if ns.trainer_type == "pipeline"
    # Pipeline Parallel
    n_microbatches: {{ ns.n_microbatches }}
    is_multistage: {{ (ns.stages_per_rank > 1) | toyaml }}
    stages_per_rank: {{ ns.stages_per_rank }}
    pp_stage_type: {{ ns.pp_stage_type | toyaml }}
    per_device_train_batch_size: {{ ns.pp_batch_size }}
    per_device_eval_batch_size: {{ ns.pp_batch_size }}
    dispatch_batches: null
-- endif

[trainer_definition]
    -- include ns.trainer_class

[datacollator]
data_collator: &data_collator !singleton:forgather.ml.data_collator:DataCollatorForCausalLM@DataCollatorForCausalLM
    tokenizer: *tokenizer
    return_tensors: pt

[lr_scheduler]
# LR Scheduler (cosine decay with warmup)
# total_steps is clamped to min_cooldown_steps ({{ ns.min_cooldown_steps }})
# so that short runs do not decay the LR all the way to zero.
lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:CosineLRScheduler@lr_scheduler
    warmup_steps: {{ ns.warmup_steps }}
    total_steps: {{ [ns.min_cooldown_steps, ns.total_steps] | max | int }}
    min_lr: {{ ns.min_lr | toyaml }}

[optimizer]
optimizer: &optimizer !partial:torch:optim.AdamW
    lr: {{ ns.global_lr | toyaml  }}

## ===== CLI arguments ========================================================
##
[dynamic_args]
    == super()
    model_project:
        names: "--model-project"
        type: path
        help: "Path to model project for model initialization"
    model_config:
        names: "--model-config"
        help: "Model project configuration for model init"
    dataset_proj:
        names: "--dataset-project"
        type: path
        help: "Path to dataset project"
    dataset_config:
        names: "--dataset-config"
        help: "Dataset project configuration"
    resume:
        names: "--resume"
        type: bool
        help: "Resume from checkpoint"
    batch_size:
        names: "--batch-size"
        type: int
        help: "Set the per-device training batch size"
    gradient_accumulation_steps:
        names: "--gradient-accumulation-steps"
        type: int
        help: "Set the number of gradient accumulation steps"
    total_tokens:
        names: "--total-tokens"
        type: int
        help: "Total training tokens (millions)"
    warmup_tokens:
        names: "--warmup-tokens"
        type: int
        help: "Total warmup tokens (millions)"
    min_cooldown_tokens:
        names: "--min-cooldown-tokens"
        type: int
        help: "Minimum tokens (millions) for LR decay phase"
    seq_len:
        names: "--seq-len"
        type: int
        help: "Set maximum sequence length"
    lr:
        names: "--lr"
        type: float
        help: "Learning rate"
    step_cadence:
        names: "--step-cadence"
        type: float
        default: 1.0
        help: "Scale log/eval/save intervals by this factor"
    peak_hardware_flops:
        names: "--peak-hardware-flops"
        type: float
        help: "Peak device FLOPS for MFU computation"
    compile:
        names: "--compile"
        type: bool
        help: "Enable torch.compile"
    torch_compile_mode:
        names: "--torch-compile-mode"
        choices: [ "default", "max-autotune", "max-autotune-no-cudagraphs" ]
        help: "Torch compile mode argument."
    dispatch_batches:
        names: "--dispatch-batches"
        type: bool
        help: "Dispatch all batches from rank-0 instead of sharding (DDP)"
    default_dtype:
        names: "--default-dtype"
        choices: [ "float32", "bfloat16", "float16" ]
        help: "Default torch dtype for model construction"
    float32_matmul_precision:
        names: "--float32-matmul-precision"
        choices: [ "highest", "high", "medium" ]
        help: "Approximate float32 matmul with bf16; highest = full float32"
    mixed_precision:
        names: "--mixed-precision"
        choices: [ "bf16", "fp16", "no" ]
        help: "Automatic Mixed Precision (AMP) dtype"
    fp8_recipe:
        names: "--fp8-recipe"
        choices: [ "tensorwise", "rowwise", "rowwise_with_gw_hp" ]
        help: "FP8 training recipe (torchao Float8Linear)"
    seed:
        names: "--seed"
        type: int
        help: "Random seed"
    trainer_type:
        names: "--trainer-type"
        choices: [ "basic", "ddp", "fsdp2", "pipeline" ]
        default: "basic"
        help: "Trainer: basic (single GPU), ddp (multi-GPU), fsdp2 (sharded DP), pipeline (pipeline parallel)"
    nproc_per_node:
        names: "--nproc-per-node"
        type: int
        help: "Processes per node: 'gpu' for all GPUs, or integer."
    pipeline_schedule:
        names: "--pipeline-schedule"
        default: "ScheduleInterleaved1F1B"
        help: "Pipeline schedule class (pipeline trainer only)"
    microbatch_scale:
        names: "--microbatch-scale"
        default: 1
        type: int
        help: "Microbatch scale factor (pipeline trainer only)"
    gradient_checkpointing:
        names: [ "--gradient-checkpointing", "-G" ]
        action: "store_true"
        help: "Enable gradient (activation) checkpointing, when supported"
    fuse_optim_with_backward:
        names: "--fuse-optim-with-backward"
        type: bool
        help: "Combine gradient computation with optimizer step"
    activation_offloading:
        names: "--activation-offloading"
        type: bool
        help: "Save activations to CPU memory"
    construct_model_on:
        names: "--construct-model-on"
        choices: [ "default", "meta", "device" ]
        help: "Where to construct the model?"
    activation_memory_budget:
        names: "--activation-memory-budget"
        type: float
        help: "https://pytorch.org/blog/activation-checkpointing-techniques"
    gc_threshold:
        names: "--gc-threshold"
        type: float
        help: "Ratio of reserved to total GPU memory to trigger GC"
    save_safetensors:
        names: "--save-safetensors"
        type: bool
        help: "Save checkpoint using safe-tensors format"