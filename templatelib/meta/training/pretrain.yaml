## ===========================================================================
## Pretrain LM project — entry-point config.
##
## Inherits from projects/lm_training_project.yaml, which handles the heavy
## lifting:
##
##   - Token-budget → step-count conversion (Chinchilla-style budgeting in
##     millions of tokens).
##   - Learning-rate scaling against a reference batch size
##     (lr = base_lr * (tokens_per_step / base_batch_size) ** lr_alpha).
##   - Cosine-decay LR schedule with warmup + minimum-cooldown clamp.
##   - Trainer dispatch by ``trainer_type`` (basic / ddp / fsdp2 / pipeline).
##   - Cross-project loading of the dataset and model definitions.
##   - dynamic_args for every common knob (so ``forgather train --help``
##     lists them all).
##
## Run as-is for a sane default pretrain (28M Llama on smollm-corpus
## fineweb-edu-packed, single-GPU basic trainer, ~560M tokens / ~1×
## Chinchilla for the model size). Uncomment the blocks below to tune.
##
## References:
##   docs/project-templates/lm-training-projects.md (full knob reference)
##   docs/trainers/trainer_options.md               (trainer-arg reference)
## ===========================================================================

-- extends "projects/lm_training_project.yaml"


[config_metadata]
    == super()
    -- set ns.config_name = "$CONFIG_NAME"
    -- set ns.config_description = "$DESCRIPTION"

    ## -----------------------------------------------------------------------
    ## Dataset
    ##
    ## Defaults from the base:
    ##   dataset_proj   = examples/datasets/HuggingFaceTB
    ##   dataset_config = smollm-corpus/fineweb-edu-packed.yaml
    ##
    ## The override below switches to the SmolLM-corpus *interleaved*
    ## packed variant (FineWeb-Edu + Cosmopedia + Python-Edu interleaved
    ## by source). Uncomment if you want a more diverse training
    ## distribution; leave commented to keep the FineWeb-Edu-only
    ## default.
    ## -----------------------------------------------------------------------
    ## -- set ns.dataset_proj = abspath(joinpath(ns.forgather_dir, "examples", "datasets", "HuggingFaceTB"))
    ## -- set ns.dataset_config = "smollm-corpus/interleaved-packed.yaml"

    ## -----------------------------------------------------------------------
    ## Model
    ##
    ## Defaults from the base:
    ##   model_project = examples/models/llama
    ##   model_config  = small.yaml   (28M params)
    ## Use medium.yaml for ~160M, or point at a custom model project (see
    ## examples/pretrain/small-llm/custom_canon for the sub-project pattern).
    ## -----------------------------------------------------------------------
    ## -- set ns.model_project_dir = abspath(joinpath(ns.forgather_dir, "examples", "models", "llama"))
    ## -- set ns.model_project_config = "medium.yaml"

    ## -----------------------------------------------------------------------
    ## Training budget (all in MILLIONS of tokens)
    ##
    ## Defaults from the base:
    ##   total_tokens         = 560   (~1× Chinchilla for a 28M model)
    ##   warmup_tokens        = 56
    ##   min_cooldown_tokens  = 300   (floor on the cosine decay window so
    ##                                 short runs don't anneal to ~0 LR)
    ## Rough Chinchilla guidance: ~20 tokens per parameter.
    ## -----------------------------------------------------------------------
    ## -- set ns.total_tokens = 2270        ## ~1× Chinchilla for a 160M model
    ## -- set ns.warmup_tokens = 114
    ## -- set ns.min_cooldown_tokens = 6800

    ## -----------------------------------------------------------------------
    ## Batching
    ##
    ## Defaults from the base:
    ##   seq_len                       = 512
    ##   per_device_train_batch_size   = 32
    ##   gradient_accumulation_steps   = 1
    ## -----------------------------------------------------------------------
    ## -- set ns.seq_len = 4096
    ## -- set ns.per_device_train_batch_size = 4
    ## -- set ns.gradient_accumulation_steps = 1

    ## -----------------------------------------------------------------------
    ## Learning rate / scaling
    ##
    ## Defaults from the base:
    ##   base_lr         = 3e-4
    ##   base_batch_size = 16384   (LR-scaling reference, in tokens)
    ##   lr_alpha        = 0.5     (sqrt scaling — noise-dominated regime)
    ## Set lr_alpha=1.0 for linear scaling, 0.0 to disable scaling.
    ## -----------------------------------------------------------------------
    ## -- set ns.base_lr = 1.5e-4

    ## -----------------------------------------------------------------------
    ## Trainer
    ##
    ## Choices: basic (single-GPU) | ddp | fsdp2 | pipeline. Default: basic.
    ## -----------------------------------------------------------------------
    ## -- set ns.trainer_type = "ddp"

    ## -----------------------------------------------------------------------
    ## Attention / precision / compile
    ##
    ## Defaults: sdpa attention, no compile.
    ## flex_attention is faster on Ampere+ and supports sliding-window /
    ## packed-sequence masks; max-autotune is the most aggressive compile
    ## mode (incompatible with gradient accumulation and pipeline parallel —
    ## use max-autotune-no-cudagraphs there).
    ## -----------------------------------------------------------------------
    ## -- set ns.attn_implementation = "flex_attention"
    ## -- set ns.torch_compile = True
    ## -- set ns.torch_compile_mode = "max-autotune"


## ---------------------------------------------------------------------------
## Trainer overrides — uncomment to enable.
##
## Anything you don't set falls back to the base template's value. The
## ``== super()`` line keeps the base's full block intact and lets you
## add or override individual keys.
## ---------------------------------------------------------------------------

## [trainer_args]
##     == super()
##     # Precision
##     float32_matmul_precision: "high"
##     default_dtype: "bfloat16"        ## bf16 weights (memory ↓, training noise ↑)
##     mixed_precision: "bf16"          ## AMP bf16 with fp32 weights (most common)
##     max_grad_norm: 1.0
##
##     # Memory / perf
##     gradient_checkpointing: True
##     enable_activation_offloading: True   ## pair with checkpointing for max savings
##     activation_memory_budget: 0.5        ## requires torch_compile=True
##
##     # Dataloader
##     dataloader_num_workers: 1
##     dataloader_prefetch_factor: 4
##
##     # Checkpointing
##     save_total_limit: 4
##     preserve_best_model: True
##     best_model_metric: "loss"
##     eval_on_save: True


## ---------------------------------------------------------------------------
## Optimizer override.
##
## Default (from the base): torch.optim.AdamW at the scaled lr.
## Common swaps below — uncomment ONE block to use it.
## ---------------------------------------------------------------------------

## [optimizer]
## ## Foreach-AdamW (forgather port) — faster than torch's default on Ampere+.
## optimizer: &optimizer !partial:forgather.ml.optim:AdamW
##     lr: {{ ns.global_lr | toyaml }}
##     foreach: True

## [optimizer]
## ## Muon — second-moment-free optimizer for hidden weights, AdamW on the rest.
## optimizer: &optimizer !partial:torch.optim:Muon
##     lr: {{ ns.global_lr | toyaml }}
##     adjust_lr_fn: "match_rms_adamw"
##
## [no_decay_optim]
## ## Muon doesn't apply to 1-D params (norms/biases/embeddings) — keep AdamW
## ## for those via the no_decay group.
## .define: &no_decay_optim !partial:torch:optim.AdamW
##     lr: !!float 0.02

## [optimizer]
## ## Adafactor — low-memory; useful for big models on tight VRAM.
## optimizer: &optimizer !partial:transformers:Adafactor
##     lr: {{ ns.global_lr | toyaml }}
##     scale_parameter: False
##     relative_step: False


## ---------------------------------------------------------------------------
## Learning-rate scheduler override.
##
## Default (from the base): CosineLRScheduler — warmup, then cosine decay
## to min_lr, with a min_cooldown_steps floor.
## ---------------------------------------------------------------------------

## [lr_scheduler]
## ## WSD — Warmup / Stable / Decay (https://arxiv.org/abs/2410.05192).
## ## Stable phase runs until decay_start_step; then harmonic decay to min_lr.
## lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:WSDScheduler@lr_scheduler
##     warmup_steps: {{ ns.warmup_steps }}
##     decay_steps: {{ ns.total_steps // 3 }}
##     decay_start_step: {{ (ns.total_steps * 2) // 3 }}
##     min_lr: {{ ns.min_lr | toyaml }}

## [lr_scheduler]
## ## Infinite — warmup → cosine to constant_lr → optional rsqrt annealing.
## ## The schedule used by examples/pretrain/small-llm.
## lr_scheduler: &lr_scheduler !partial:forgather.ml.optim:InfiniteLRScheduler@lr_scheduler
##     warmup_steps: {{ ns.warmup_steps }}
##     cooldown_steps: {{ ns.total_steps // 3 }}
##     constant_lr: {{ (ns.global_lr / 3) | toyaml }}
##     min_lr: {{ ns.min_lr | toyaml }}
##     annealing_type: "rsqrt"
##     annealing_steps: {{ ns.total_steps // 10 }}


## ---------------------------------------------------------------------------
## Loss + callbacks — uncomment to enable.
## ---------------------------------------------------------------------------

## [fused_loss_factory]
## ## Fused output-linear × cross-entropy kernel; reduces peak memory on the
## ## logits and is faster than the unfused path on Ampere+. Worth turning
## ## on for any non-trivial vocab size.
## .define: &fused_loss_factory !partial:forgather.ml.loss:LinearCrossEntropyLoss

## [trainer_callbacks]
## ## The standard LM callbacks — gradient norms, throughput, sample
## ## generations every N eval steps. See templatelib/base/callbacks/.
##     -- include "callbacks/lm_callbacks.yaml"
