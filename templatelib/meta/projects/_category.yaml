title: "Projects"
summary: "Scaffolds for full training projects (the default config of a new project)."
description: |
  Scaffolds that produce the entry-point config of a new training project
  — the kind of file that lives under a project's `configs/` directory
  and inherits from a project-level base in `templatelib/`.

  Pick one when scaffolding a *new project* (via the New Project modal's
  Starting point picker); the rendered config becomes the project's
  default config, ready to run as-is and refine by hand.
