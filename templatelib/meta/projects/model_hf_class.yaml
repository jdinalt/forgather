## ===========================================================================
## HF-class model project — entry-point config.
##
## Use this scaffold when you want to define a model that just instantiates
## a HuggingFace `PretrainedConfig` class (e.g. `LlamaConfig`, `GPT2Config`,
## `MistralConfig`, `Qwen3Config`, `Gemma3Config`) with a chosen tokenizer
## and size overrides. No Forgather model "bits", no generated Python file
## under output_dir — the model class comes straight from the HF transformers
## library.
##
## When this is NOT the right scaffold:
##   - You want Llama-family topology but with control over the bits (e.g.
##     swap attention factory) — use model_llama_derived.
##   - You want a from-scratch architecture you'll evolve over time —
##     use model_from_scratch.
##
## Example shape: templatelib/examples/models/transformers/gpt2.yaml and
## ...llama.yaml (the HF-class siblings of dynamic_llama.yaml).
##
## References:
##   docs/guides/creating-a-model-project.md         (concepts)
##   docs/guides/model-cli.md                        (forgather model CLI)
##   templatelib/base/models/causal_lm/from_pretrained_class.yaml
##                                                    (the base)
## ===========================================================================

-- extends "projects/causal_lm_def.yaml"

[config_metadata]
    == super()
    -- set ns.config_name = "$CONFIG_NAME"
    -- set ns.config_description = "$DESCRIPTION"

[model_definition]
    -- include "config.default.model"


#------------- config.default.model --------------
-- extends "models/causal_lm/from_pretrained_class.yaml"

[model_meta_config]
    == super()
    -- set ns.model_name = ns.config_name
    -- set ns.model_description = ns.config_description
    ## Documentation only — surfaces in `forgather model show`.
    ## -- set ns.model_source = "https://huggingface.co/docs/transformers/model_doc/..."

    ## ---- The HF config class ----
    ## Any subclass of transformers.PretrainedConfig — the model is
    ## instantiated via AutoModelForCausalLM.from_config against this
    ## class. Common choices:
    ##
    ##   transformers:GPT2Config
    ##   transformers:LlamaConfig
    ##   transformers:MistralConfig
    ##   transformers:Qwen3Config
    ##   transformers:Gemma3TextConfig
    ##   transformers:OpenAIGPTConfig
    ##
    ## The config's field names (hidden_size / n_positions / etc.) come
    ## from the HF class itself — see its configuration_<name>.py source.
    -- set ns.model_config_cls = '$HF_CONFIG_CLASS'


## ---------------------------------------------------------------------------
## Tokenizer.
##
## Pick a HuggingFace AutoTokenizer that matches the architecture, or
## point at a local Forgather tokenizer project. For GPT-2 you have to
## add a pad token explicitly (the base tokenizer ships without one);
## see the example below.
## ---------------------------------------------------------------------------

[model_tokenizer]
## --- Standard: AutoTokenizer from a HF id ---
tokenizer: &tokenizer !call:transformers:AutoTokenizer.from_pretrained@tokenizer
    arg0: {{ tokenizer_id_or_path | toyaml('openai-community/gpt2') }}
    model_max_length: {{ max_model_length | toyaml(1024) }}
    trust_remote_code: True

## --- GPT-2-style: add a pad token (the base tokenizer lacks one) ---
## tokenizer: &tokenizer !call:forgather.ml.construct:add_special_tokens@tokenizer
##     tokenizer:
##         !call:transformers:AutoTokenizer.from_pretrained
##             - "openai-community/gpt2"
##     token_map:
##         pad_token: "[PAD]"

## --- Local Forgather tokenizer project ---
## tokenizer: &tokenizer !call:forgather:from_project@tokenizer
##     project_dir: "{{ joinpath(ns.forgather_dir, 'examples', 'tokenizers', 'wikitext') }}"
##     config_template: "32k.yaml"


## ---------------------------------------------------------------------------
## Model config overrides.
##
## ``super()`` keeps the base's wiring (vocab_size derived from the
## tokenizer length); add the architecture knobs your chosen HF config
## class accepts. The field names below are illustrative — consult the
## HF source for the actual list.
## ---------------------------------------------------------------------------

[model_config]
    == super()
    ## ---- Common (most HF causal-LM configs) ----
    ## hidden_size: 768                  ## or n_embd / d_model on some configs
    ## num_attention_heads: 12           ## or n_head
    ## num_hidden_layers: 12             ## or n_layer
    ## intermediate_size: 3072           ## or n_inner

    ## ---- Position embeddings ----
    ## max_position_embeddings: !call:getattr [ *tokenizer, 'model_max_length' ]
    ## n_positions: !call:getattr [ *tokenizer, 'model_max_length' ]   ## GPT-2

    ## ---- Special tokens (most HF configs accept these) ----
    ## bos_token_id: !call:getattr [ *tokenizer, 'bos_token_id' ]
    ## eos_token_id: !call:getattr [ *tokenizer, 'eos_token_id' ]
    ## pad_token_id: !call:getattr [ *tokenizer, 'pad_token_id' ]

    ## ---- Llama / Mistral / Qwen3 specific ----
    ## num_key_value_heads: 4
    ## rms_norm_eps: 1.0e-5
    ## rope_theta: 10000.0


## ---------------------------------------------------------------------------
## Save-rule for the tokenizer. Required for `forgather model construct` to
## write a usable model directory: the project base's main block references
## the `*pretrained_tokenizer` alias to materialise (and reload from disk)
## the tokenizer alongside the saved config. Without this block the leaf
## config parses but the main output references an undefined alias.
##
## Same shape as templatelib/base/models/causal_lm/custom.yaml — kept here
## explicitly because from_pretrained_class.yaml doesn't supply it
## (it's used historically as a snippet, not a standalone leaf config).
## ---------------------------------------------------------------------------

[model_constructor]
    == super()
pretrained_tokenizer: &pretrained_tokenizer !singleton:forgather.ml.construct:build_rule@pretrained_tokenizer
    target: "{{ joinpath(ns.output_dir, 'tokenizer.json') }}"
    recipe: !partial:call [ !singleton:getattr [ *tokenizer, "save_pretrained"], "{{ ns.output_dir }}" ]
    loader: !partial:transformers:AutoTokenizer.from_pretrained
        arg0: "{{ ns.output_dir }}"
        trust_remote_code: True
