title: "HuggingFace dataset (single variant)"
description: |
  A HuggingFace dataset that takes only a `path:` argument — no `name=`
  variant selection. Use this for single-config datasets like
  `wikitext-103-raw-v1` referenced directly by their full id.
target_kind: "config"
fields:
  - name: CONFIG_NAME
    label: "Config name"
    description: "Short label shown in `forgather ls` listings."
    required: true
  - name: DESCRIPTION
    label: "Description"
    description: "One-line description, shown in `forgather ls`."
    required: true
  - name: SOURCE
    label: "Source URL"
    description: "Where the dataset comes from."
    placeholder: "https://huggingface.co/datasets/..."
    required: true
  - name: DATASET_ID
    label: "Dataset id"
    description: "The HuggingFace dataset id (`path` argument to `load_dataset`)."
    placeholder: "Salesforce/wikitext"
    required: true
  - name: VALIDATION_SPLIT
    label: "Validation split"
    description: "Split slice used for validation, e.g. `validation[:1000]`."
    default: "validation[:1000]"
  - name: TEST_SPLIT
    label: "Test split"
    description: "Split slice used for evaluation."
    default: "test"
