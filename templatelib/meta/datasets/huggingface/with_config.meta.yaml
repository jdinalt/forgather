title: "HuggingFace dataset (with config name)"
description: |
  A HuggingFace dataset that takes both a `path:` and a `name:` argument,
  C4-style. Use this when the dataset on the Hub has multiple variants
  selected by `name=` (e.g. allenai/c4 with name="en").
target_kind: "config"
fields:
  - name: CONFIG_NAME
    label: "Config name"
    description: "Short label shown in `forgather ls` listings."
    placeholder: "C4"
    required: true
  - name: DESCRIPTION
    label: "Description"
    description: "One-line description, shown in `forgather ls`."
    required: true
  - name: SOURCE
    label: "Source URL"
    description: "Where the dataset comes from."
    placeholder: "https://huggingface.co/datasets/allenai/c4"
    required: true
  - name: DATASET_ID
    label: "Dataset id"
    description: "The HuggingFace dataset id (`path` argument to `load_dataset`)."
    placeholder: "allenai/c4"
    required: true
  - name: DATASET_CONFIG
    label: "Dataset config"
    description: "The variant within the dataset (`name` argument to `load_dataset`)."
    placeholder: "en"
    required: true
  - name: VALIDATION_SPLIT
    label: "Validation split"
    description: "Split slice used for validation, e.g. `validation[:1000]`."
    default: "validation[:1000]"
  - name: TEST_SPLIT
    label: "Test split"
    description: "Split slice used for evaluation, e.g. `validation[1000:100000]`."
    default: "validation[1000:100000]"
