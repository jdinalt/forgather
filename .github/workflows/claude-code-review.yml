name: Claude Code Review

on:
  # Auto-trigger on PR events is disabled: the action currently fails with a
  # `directory mismatch ... tsconfig.json ... fd 4` internal error in the
  # anthropics/claude-code-action@v1 sandbox. Manual dispatch with an
  # explicit `pr` input is the fallback path until the upstream bug is
  # fixed. Re-enable by restoring the `pull_request:` block below.
  #
  # Trigger manually with:
  #   gh workflow run claude-code-review.yml -f pr=33
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        type: string
        required: true
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]
  #   # Optional: Only run on specific file changes
  #   # paths:
  #   #   - "src/**/*.ts"
  #   #   - "src/**/*.tsx"
  #   #   - "src/**/*.js"
  #   #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Use the dispatch input when manually triggered; fall back to the
          # PR event number for the (currently disabled) pull_request trigger.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

