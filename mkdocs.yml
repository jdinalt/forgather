site_name: Forgather
site_description: Configuration-driven ML framework built on template inheritance and code generation.
site_author: Jason dinAlt
repo_url: https://github.com/jdinalt/forgather
repo_name: jdinalt/forgather

docs_dir: docs

# What scoping we need at this layer is now narrow: docs/ is composed
# of file-level symlinks pointing only at md / ipynb / png / svg / py /
# yaml / yml / jinja leaves (see the symlink layout under docs/), so
# the worst polluters from the old whole-directory mirror are already
# absent. We just need to deny generated trees and stray bytecode.
# meta.yaml / meta_defaults.yaml DO get copied into site/ because
# tutorial / example READMEs link to them; the project-tree pollution
# that used to cause is handled separately by
# discovery._prune_mkdocs_site, which strips site/ out of the
# project-discovery walk.
#
# An earlier draft used a default-deny `*` allowlist here. That broke
# the rendered site because mkdocs's exclude_docs filter is applied
# before theme assets get attached, so `*` swept up the Material
# theme's stylesheets/JS too. Stick with explicit denies.
exclude_docs: |
  output_models/
  runs/
  tmp/
  __pycache__/
  .forgather_history
  *.pyc

# Files that exist in docs/ as cross-link targets but are reachable
# only through inline links from primary nav pages. Listing them here
# silences the "exists in docs but not in nav" notices without hiding
# the pages themselves.
not_in_nav: |
  forgather-server.md
  configuration/syntax_test.ipynb
  examples/**
  guides/README.md
  guides/forgather-server-walkthrough.md
  guides/model-update.md
  guides/server-cli.md
  syntax_highlighting/**
  tools/**
  trainers/diloco-architecture.md
  trainers/distributed-eval-zero-batches.md
  tutorials/dynamic_lm/README.md
  tutorials/hp_lovecraft_project/4k_spike_investigation.md
  tutorials/hp_lovecraft_project/long_context_experiments.md
  tutorials/hp_lovecraft_project/lovecraft_reference/**
  tutorials/project_composition/README.md
  tutorials/projects_overview/README.md
  tutorials/tiny_llama/custom_models/**
  tutorials/tiny_llama/project_index.ipynb

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
      include: ["*.ipynb"]
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          # Force griffe to use pure static AST analysis. The docs build
          # does not install forgather, so any fallback to runtime
          # inspection would fail to import the package. Keeping this
          # explicit also stops the build from silently picking up
          # whichever forgather happens to be on sys.path.
          options:
            allow_inspection: false
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

